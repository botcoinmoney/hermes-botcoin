name: ✨ Feature request
description: A new tool, slash subcommand, solver provider, or capability.
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What's missing today? Concrete user story.
      placeholder: |
        I want to mine for a pool contract but `botcoin_submit_artifact` doesn't expose
        a clean way to flag pool=true; I have to hand-edit calldata.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What should the API look like? Tool name, slash subcommand, env var, etc.
      placeholder: |
        Add `pool: bool = false` parameter to botcoin_submit_artifact (matches the protocol skill).
        OR add a `botcoin_pool_mine` wrapper tool.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways you've thought about, and why this proposal wins.

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - Plugin (new tool / slash / CLI)
        - MCP server
        - Cron miner / autonomous mode
        - Bundled SKILL.md
        - Documentation only
        - Cross-cutting
    validations:
      required: true

  - type: checkboxes
    id: protocol_check
    attributes:
      label: Protocol alignment
      options:
        - label: This works within the existing coordinator API (no new endpoints needed)
        - label: This requires new coordinator endpoints — I've opened a corresponding issue at agentmoney.net or noted it below
