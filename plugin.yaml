name: botcoin
version: "0.1.2"
description: "Mine BOTCOIN on Base via the AgentMoney coordinator. Adds /botcoin slash, hermes botcoin CLI, an always-on discoverability hook, and a bundled mining-strategy skill. The agent itself is the solver — challenges flow as tool results, you produce the artifact, the plugin handles auth, signing, and on-chain receipts."
author: "BOTCOIN (botcoinmoney)"
license: MIT
homepage: "https://github.com/botcoinmoney/hermes-botcoin"
provides_tools:
  - botcoin_status
  - botcoin_setup_check
  - botcoin_scorecard
  - botcoin_bind_agent_id
  - botcoin_request_challenge
  - botcoin_submit_artifact
  - botcoin_post_receipt
  - botcoin_claim_rewards
  - botcoin_stake
  - botcoin_unstake
  - botcoin_withdraw_stake
  - botcoin_autostart
  - botcoin_autostop
provides_hooks:
  - pre_llm_call
  - on_session_start
# requires_env intentionally omitted — Hermes treats missing requires_env values
# as a load gate. The plugin loads cleanly with zero env vars set; tools that
# need a signer are gated by check_fn at the registry layer, and `/botcoin
# setup` walks the user through what's missing. Optional env vars (with
# masked-input UX) are still documented in README + `.env.example`.
